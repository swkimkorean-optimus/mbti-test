<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>표준 MBTI 테스트</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        .question-card {
            transition: all 0.3s ease-in-out;
            animation: fadeIn 0.4s forwards;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(15px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .radio-label:has(input:checked) {
            background-color: #4f46e5;
            color: #ffffff;
            border-color: #4f46e5;
        }
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #1f2937;
        }
        ::-webkit-scrollbar-thumb {
            background: #4b5563;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #6b7280;
        }
    </style>
</head>
<body class="bg-gray-900 text-white min-h-screen flex items-center justify-center p-4">
    <div class="container mx-auto max-w-2xl w-full">
        
        <!-- 메인 메뉴 -->
        <div id="main-menu" class="text-center transition-opacity duration-500 py-10">
            <h1 class="text-4xl md:text-5xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-indigo-400 to-purple-500 mb-4">표준 MBTI 테스트</h1>

            <div class="flex justify-center">
                <button onclick="startTest()" class="w-full md:w-auto bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3.5 px-8 rounded-xl shadow-lg transition duration-300 transform hover:scale-105">
                    테스트 시작하기
                </button>
            </div>
        </div>

        <!-- 검사 화면 -->
        <div id="test-view" class="hidden">

                <div class="flex items-center justify-between mb-6 pb-4 border-b border-gray-700">
                    <h2 id="test-title" class="text-2xl font-bold text-indigo-300">표준 MBTI 진단</h2>
                    <span id="progress-indicator" class="text-xs text-gray-400 bg-gray-900 px-3 py-1 rounded-full">총 30문항</span>
                </div>
                
                <div id="questions-container" class="space-y-6 max-h-[60vh] overflow-y-auto pr-3">
                    <!-- JavaScript로 문항 동적 생성 -->
                </div>
                
                <div class="mt-8 flex flex-col md:flex-row gap-4">
                    <button id="submit-btn" onclick="calculateResult()" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3.5 px-6 rounded-xl transition duration-300 shadow-md hover:shadow-green-900/30">
                        결과 확인하기
                    </button>
                    <button onclick="showMainMenu()" class="w-full md:w-1/3 bg-gray-700 hover:bg-gray-600 text-white font-bold py-3.5 px-6 rounded-xl transition duration-300">
                        처음으로
                    </button>
                </div>
            </div>
        </div>
        
        <!-- 결과 모달 -->
        <div id="result-modal" class="fixed inset-0 bg-black/80 flex items-center justify-center p-4 hidden z-50 backdrop-blur-sm">
            <div id="modal-card" class="bg-gray-800 rounded-2xl shadow-2xl max-w-2xl w-full max-h-[90vh] overflow-y-auto p-6 md:p-8 relative border border-gray-700 transform transition-all duration-300 scale-95 opacity-0">

                <div id="result-content" class="text-center">

                    <p id="result-subtitle" class="text-xl font-medium text-gray-300 mb-6"></p>
                    <div id="result-description" class="text-left text-gray-300 space-y-4 bg-gray-900/50 p-5 rounded-xl border border-gray-700/50 leading-relaxed text-sm md:text-base">
                        <!-- 설명 인젝션 -->
                    </div>
                </div>

                <!-- 심층 분석 영역 (독립 실행형) -->

                            🌱 맞춤 성장 조언

                    bestMatch: "INFP, INTP (창의적인 발상과 전략적 추진이 만나 시너지를 내는 최상의 콤비)"
                }
            }
        };

        let currentMbtiType = ''; 
        const mainMenu = document.getElementById('main-menu');
        const testView = document.getElementById('test-view');
        const questionsContainer = document.getElementById('questions-container');
        const resultModal = document.getElementById('result-modal');
        const modalCard = document.getElementById('modal-card');
        const alertBox = document.getElementById('alert-box');
        const geminiResultContainer = document.getElementById('gemini-result-container');
        const geminiResultContent = document.getElementById('gemini-result-content');

        function startTest() {
            mainMenu.classList.add('hidden');
            testView.classList.remove('hidden');
            loadQuestions();
        }

        function showMainMenu() {
            testView.classList.add('hidden');
            mainMenu.classList.remove('hidden');
            questionsContainer.innerHTML = '';
        }

        function loadQuestions() {
            questionsContainer.innerHTML = '';
            standardQuestions.forEach((q, index) => {
                const questionNumber = index + 1;
                const card = document.createElement('div');
                card.className = 'question-card bg-gray-700/60 p-5 rounded-xl border border-gray-700 hover:border-gray-600 transition';
                
                card.innerHTML = `
                    <p class="text-base md:text-lg font-medium mb-4 leading-relaxed">
                        <span class="text-indigo-400 font-bold mr-1">${questionNumber}.</span> ${q}
                    </p>
                    <div class="flex gap-3">
                        <label class="radio-label flex-1 cursor-pointer text-center py-2.5 px-4 border border-gray-600 rounded-lg transition font-medium hover:bg-gray-600">
                            <input type="radio" name="q${questionNumber}" value="yes" class="hidden"> 네 (그렇다)
                        </label>
                        <label class="radio-label flex-1 cursor-pointer text-center py-2.5 px-4 border border-gray-600 rounded-lg transition font-medium hover:bg-gray-600">
                            <input type="radio" name="q${questionNumber}" value="no" class="hidden"> 아니오 (아니다)
                        </label>
                    </div>
                `;
                questionsContainer.appendChild(card);
            });
        }
        
        function showAlert() {
            alertBox.classList.remove('hidden', 'translate-x-full');
            alertBox.classList.add('translate-x-0');
            setTimeout(() => {
                alertBox.classList.remove('translate-x-0');
                alertBox.classList.add('translate-x-full');
                setTimeout(() => alertBox.classList.add('hidden'), 300);
            }, 2500);
        }

        function calculateResult() {
            const questionCount = standardQuestions.length;
            const answers = [];
            
            for (let i = 1; i <= questionCount; i++) {
                const selected = document.querySelector(`input[name="q${i}"]:checked`);
                if (!selected) {
                    showAlert();
                    // 미답변 문항으로 스크롤 이동
                    const unansweredElem = document.querySelector(`input[name="q${i}"]`)?.closest('.question-card');
                    if (unansweredElem) {
                        unansweredElem.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    }
                    return;
                }
                answers.push(selected.value);
            }

            const scores = { E: 0, I: 0, S: 0, N: 0, T: 0, F: 0, J: 0, P: 0 };
            answers.forEach((answer, index) => {
                const questionNumber = index + 1;
                const mapping = standardScoringMap[questionNumber];
                const scoreKey = answer === 'yes' ? mapping[0] : mapping[1];
                scores[scoreKey]++;
            });

            let resultType = '';
            resultType += scores.E >= scores.I ? 'E' : 'I';
            resultType += scores.S >= scores.N ? 'S' : 'N';
            resultType += scores.T >= scores.F ? 'T' : 'F';
            resultType += scores.J >= scores.P ? 'J' : 'P';
            
            displayResult(resultType);
        }

        function displayResult(type) {
            currentMbtiType = type;
            geminiResultContainer.classList.add('hidden');
            geminiResultContent.innerHTML = '';

            const resultData = results[type];
            document.getElementById('result-type').textContent = type;
            document.getElementById('result-subtitle').textContent = resultData.subtitle;
            document.getElementById('result-description').innerHTML = resultData.description;

            resultModal.classList.remove('hidden');
            setTimeout(() => {
                modalCard.classList.remove('scale-95', 'opacity-0');
                modalCard.classList.add('scale-100', 'opacity-100');
            }, 10);
        }

        // 외부 API 대신 내장 데이터를 이용해 즉각 렌더링 (독립 실행형)
        function renderInsight(type) {
            if (!currentMbtiType) return;
            const data = results[currentMbtiType];
            if (!data) return;

            geminiResultContainer.classList.remove('hidden');

            if (type === 'growth') {
                const listItems = data.growth.map(item => `<li class="pl-2 list-disc">${item}</li>`).join('');
                geminiResultContent.innerHTML = `
                    <h5 class="font-bold text-indigo-300 mb-2 flex items-center gap-1.5 text-base">🌱 ${currentMbtiType} 유형을 위한 성장 맞춤 조언</h5>
                    <ul class="space-y-2 text-gray-300 ml-4">
                        ${listItems}
                    </ul>
                `;
            } else if (type === 'jobs') {
                geminiResultContent.innerHTML = `
                    <h5 class="font-bold text-purple-300 mb-2 flex items-center gap-1.5 text-base">💼 ${currentMbtiType} 유형 맞춤 직업 및 파트너</h5>
                    <div class="space-y-3 text-gray-300">
                        <p><strong class="text-white">추천 직무/직업군:</strong> ${data.jobs.recommendations}</p>
                        <p><strong class="text-white">최상의 시너지 궁합:</strong> ${data.jobs.bestMatch}</p>
                    </div>
                `;
            }
            geminiResultContainer.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }

        function closeResult() {
            modalCard.classList.remove('scale-100', 'opacity-100');
            modalCard.classList.add('scale-95', 'opacity-0');
            setTimeout(() => {
                resultModal.classList.add('hidden');
                showMainMenu();
            }, 250);
        }
    </script>
</body>
</html>
